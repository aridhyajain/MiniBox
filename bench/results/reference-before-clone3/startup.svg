<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 478" width="1020" height="478" role="img" aria-label="Startup time per configuration">
<title>Startup time per configuration</title>
<style>
  svg { --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --grid:#d8dee4;
        --c1:#2f6feb; --c2:#d4761a; --c3:#2c9a5b; --pass:#1a7f37; --fail:#cf222e; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --grid:#30363d;
          --c1:#6ea0ff; --c2:#f0a050; --c3:#4cc38a; --pass:#3fb950; --fail:#ff7b72; }
  }
  .bg { fill:var(--bg); } text { fill:var(--fg); font-family:system-ui,Segoe UI,Helvetica,Arial,sans-serif; }
  .title { font-size:18px; font-weight:600; } .sub { font-size:12px; fill:var(--muted); }
  .axis, .tick { font-size:12px; fill:var(--muted); } .lbl { font-size:12px; }
  .grid { stroke:var(--grid); stroke-width:1; } .whisk { stroke:var(--fg); stroke-width:2; fill:none; }
  .c1 { fill:var(--c1); } .c2 { fill:var(--c2); } .c3 { fill:var(--c3); }
  .pass { fill:var(--pass); font-weight:600; } .fail { fill:var(--fail); font-weight:600; }
  .note { font-size:12px; font-style:italic; fill:var(--muted); }
  .dash { stroke:var(--fg); stroke-width:1.5; stroke-dasharray:5 4; }
</style>

<rect class="bg" width="100%" height="100%"/>
<text x="24.0" y="30.0" class="title" text-anchor="start">Startup time per configuration</text>
<text x="24.0" y="50.0" class="sub" text-anchor="start">Log scale. Bar = median, whisker = p95 (lower is better). n=30 per configuration</text>
<line class="grid" x1="80" x2="980" y1="390.0" y2="390.0"/>
<text x="72.0" y="394.0" class="tick" text-anchor="end">1</text>
<line class="grid" x1="80" x2="980" y1="350.8" y2="350.8"/>
<text x="72.0" y="354.8" class="tick" text-anchor="end">2</text>
<line class="grid" x1="80" x2="980" y1="298.9" y2="298.9"/>
<text x="72.0" y="302.9" class="tick" text-anchor="end">5</text>
<line class="grid" x1="80" x2="980" y1="259.6" y2="259.6"/>
<text x="72.0" y="263.6" class="tick" text-anchor="end">10</text>
<line class="grid" x1="80" x2="980" y1="220.4" y2="220.4"/>
<text x="72.0" y="224.4" class="tick" text-anchor="end">20</text>
<line class="grid" x1="80" x2="980" y1="168.5" y2="168.5"/>
<text x="72.0" y="172.5" class="tick" text-anchor="end">50</text>
