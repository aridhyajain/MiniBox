<text x="72.0" y="133.2" class="tick" text-anchor="end">100</text>
<line class="grid" x1="80" x2="980" y1="90.0" y2="90.0"/>
<text x="72.0" y="94.0" class="tick" text-anchor="end">200</text>
<text class="axis" transform="translate(16,240.0) rotate(-90)" text-anchor="middle">Wall-clock time to run /bin/true (ms, log scale)</text>
<rect class="c1" x="121.2" y="359.4" width="67.5" height="30.6"/>
<path class="whisk" d="M155.0 359.4 V316.8 M147.0 316.8 H163.0 M147.0 359.4 H163.0"/>
<text x="155.0" y="308.8" class="tick" text-anchor="middle">1.7 ms (p95 3.6)</text>
<text x="155.0" y="412.0" class="lbl" text-anchor="middle">host true</text>
<rect class="c1" x="271.2" y="313.0" width="67.5" height="77.0"/>
<path class="whisk" d="M305.0 313.0 V269.7 M297.0 269.7 H313.0 M297.0 313.0 H313.0"/>
<text x="305.0" y="261.7" class="tick" text-anchor="middle">3.9 ms (p95 8.4)</text>
<text x="305.0" y="412.0" class="lbl" text-anchor="middle">unshare ns</text>
<rect class="c1" x="421.2" y="311.6" width="67.5" height="78.4"/>
<path class="whisk" d="M455.0 311.6 V264.1 M447.0 264.1 H463.0 M447.0 311.6 H463.0"/>
<text x="455.0" y="256.1" class="tick" text-anchor="middle">4.0 ms (p95 9.2)</text>
<text x="455.0" y="412.0" class="lbl" text-anchor="middle">minibox nolimits</text>
<rect class="c1" x="571.2" y="193.5" width="67.5" height="196.5"/>
<path class="whisk" d="M605.0 193.5 V190.6 M597.0 190.6 H613.0 M597.0 193.5 H613.0"/>
<text x="605.0" y="182.6" class="tick" text-anchor="middle">32.1 ms (p95 33.8)</text>
<text x="605.0" y="412.0" class="lbl" text-anchor="middle">minibox limits</text>
<rect class="c1" x="721.2" y="100.8" width="67.5" height="289.2"/>
<path class="whisk" d="M755.0 100.8 V91.6 M747.0 91.6 H763.0 M747.0 100.8 H763.0"/>
<text x="755.0" y="83.6" class="tick" text-anchor="middle">165.4 ms (p95 194.3)</text>
<text x="755.0" y="412.0" class="lbl" text-anchor="middle">minibox veth</text>
<text x="755.0" y="428.0" class="lbl" text-anchor="middle">limits</text>
<text x="905.0" y="382.0" class="note" text-anchor="middle">not measured</text>
<text x="905.0" y="412.0" class="lbl" text-anchor="middle">docker</text>
<text x="24.0" y="448.0" class="note" text-anchor="start">Not measured: docker (docker CLI not found)</text>
</svg>
