<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>minibox</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <h1>minibox</h1>
    <span class="muted">container runtime, local control panel (127.0.0.1 only)</span>
  </header>

  <main>
    <div id="banner" class="banner" role="alert" hidden></div>

    <section>
      <h2>run</h2>
      <form id="launch-form" autocomplete="off">
        <label class="wide">command
          <input id="f-command" class="mono" name="command" required maxlength="1000"
                 placeholder="sh -c 'echo hello; sleep 300'" spellcheck="false">
        </label>
        <label>name <input id="f-name" class="mono" name="name" maxlength="31" spellcheck="false"></label>
        <label>hostname <input id="f-hostname" class="mono" name="hostname" maxlength="63" spellcheck="false"></label>
        <label>memory (K, M or G) <input id="f-memory" class="mono" name="memory" maxlength="14" placeholder="64M"></label>
        <label>cpus (cores) <input id="f-cpus" class="mono" name="cpus" maxlength="8" placeholder="0.5" inputmode="decimal"></label>
        <label>pids (max tasks) <input id="f-pids" class="mono" name="pids" maxlength="5" placeholder="32" inputmode="numeric"></label>
        <label>network
          <select id="f-net" name="net">
            <option value="none">none (own empty namespace)</option>
            <option value="veth">veth (own IP)</option>
          </select>
        </label>
        <label class="wide check">
          <input type="checkbox" id="f-init" name="init">
          init: run a reaper as PID 1 (reaps zombies, forwards signals)
        </label>
        <div class="wide actions">
          <button id="launch-btn" type="submit" class="primary">run</button>
          <span class="muted">Limits are optional. The command runs in the Alpine rootfs of the project.</span>
        </div>
      </form>
    </section>

    <section>
      <h2>containers</h2>
      <p id="empty" class="empty" hidden>No containers.</p>
      <div class="table-wrap">
        <table id="containers" hidden>
          <thead>
            <tr>
              <th scope="col">id</th>
              <th scope="col">name / command</th>
              <th scope="col">state</th>
              <th scope="col" class="num">memory</th>
              <th scope="col" class="num">cpu</th>
              <th scope="col" class="num">pids</th>
              <th scope="col">started</th>
              <th scope="col">actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <section id="detail" hidden>
      <div class="detail-head">
        <h2 id="detail-title">container</h2>
        <button id="detail-close" type="button">close</button>
      </div>

      <h3>logs <span class="muted">last 200 lines</span></h3>
      <div class="actions"><button id="logs-refresh" type="button">refresh</button></div>
      <pre id="logs" class="output" tabindex="0"></pre>

      <h3>exec</h3>
      <form id="exec-form" class="exec" autocomplete="off">
        <input id="exec-command" class="mono" placeholder="ps" maxlength="1000" spellcheck="false" aria-label="Command to run inside the container">
        <button id="exec-btn" type="submit">run</button>
      </form>
      <div id="exec-status" class="muted"></div>
      <pre id="exec-out" class="output" tabindex="0"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
